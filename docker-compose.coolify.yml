# docker-compose.coolify.yml
# Self-contained Coolify compose for the forked repo.
#
# Source: your fork of https://github.com/wihlarkop/applykit.git
# In Coolify: create a "Docker Compose" resource and point it at your fork.
# Coolify will automatically use this docker-compose.coolify.yml file.
#
# Architecture:
#   applykit.mattschwarz.io      → nginx → Frontend (SvelteKit)
#   applykit.mattschwarz.io/api  → nginx → Backend (FastAPI)
#
# Setup in Coolify:
#   1. Fork the public repo on GitHub.
#   2. Commit this file and nginx.conf to your fork.
#   3. In Coolify: New Resource → Docker Compose
#   4. Git Repository: your fork (e.g. https://github.com/YOURNAME/applykit.git)
#   5. Branch: main
#   6. Coolify auto-detects docker-compose.coolify.yml (or select it manually)
#   7. Assign ONLY the nginx service a domain: applykit.mattschwarz.io
#   8. Make sure frontend and backend get NO domains (hidden by traefik.enable=false).
#   9. Enable Basic Auth (or another auth method) in Coolify for the nginx service.
#  10. Deploy.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - applykit-data:/data
    environment:
      DATABASE_URL: sqlite:////data/applykit.db
      CORS_ORIGINS: '["https://applykit.mattschwarz.io"]'
    networks:
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    networks:
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - coolify
    restart: unless-stopped
    # This is the ONLY publicly exposed service.
    # Coolify will attach Traefik here automatically.

volumes:
  applykit-data:

networks:
  coolify:
